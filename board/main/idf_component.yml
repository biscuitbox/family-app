## 관제 센터 보드가 쓰는 부품 (ESP Component Registry)
##
## 버전 고정: 실제 보드에서 화면·터치·Wi-Fi가 동작한 조합 (2026-11-21)
##   보드 JC8012P4A1C (스티커 SKU 10153001-V3, 배치 2639), P4 칩 v3.2, ESP-IDF 6.1.1
## "~x.y.z"는 맨 끝 숫자(버그 수정)만 올라가게 한다. 다른 버전으로 올릴 때는 보드에서 다시 확인하고 이 표를 고친다.
dependencies:
  idf: ">=6.1"                              # guition 터치 부품이 6.1 이상을 요구
  lvgl/lvgl: "~9.6.0"
  espressif/esp_lvgl_port: "~2.9.0"
  espressif/esp_lcd_jd9365: "~2.0.2"        # 화면 (JD9365, MIPI-DSI)
  guition/esp_lcd_touch_gsl3680: "~0.1.0"   # 터치 (GSL3680, Guition 펌웨어 포함)
  espressif/esp_wifi_remote: "~1.6.5"       # ESP32-P4에서 esp_wifi 함수를 C6로 넘김
  # P4 ↔ C6 연결. 보드에 들어 있는 C6 펌웨어는 2.3.2라서 부팅 때
  # "major version mismatch — OTA coprocessor from host" 안내가 찍히지만 Wi-Fi는 동작한다.
  # 같은 보드에서 2.x로 낮추면 Wi-Fi가 아예 켜지지 않았다는 사례가 있으니 3.x에 둔다.
  espressif/esp_hosted: "~3.1.0"
  espressif/cjson:
    version: "~1.7.19"
    rules:
      - if: "idf_version >=6.0"
